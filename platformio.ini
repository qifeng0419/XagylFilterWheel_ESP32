; ============================================================================
;  PlatformIO 工程配置（可选；Arduino IDE 用户忽略本文件）
;  依赖库自动安装：TMCStepper 是 Trinamic 生态的标准 Arduino 驱动库
; ============================================================================
[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
build_flags       =
    -Wall
    -Wextra
    -Wno-unused-parameter
; 若硬件把 MT6701 接在 SSI/SPI 上，改为 -D FW_ENCODER_BUS=2
; 若不需要 TMC UART（纯 STEP/DIR 硬件模式），改为 -D FW_ENABLE_TMC_UART=0
lib_deps          =
    teemuatlut/TMCStepper@^1.8.1
