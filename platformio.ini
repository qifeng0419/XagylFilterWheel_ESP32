; ============================================================================
;  PlatformIO 工程
;
;  常用命令：
;    pio run                    编译固件
;    pio run -t upload          编译并烧录
;    pio device monitor         看服务台（UART0 115200）
;    pio test -e native         在 PC 上跑纯逻辑单元测试（不需要硬件）
;    pio check -e esp32dev      静态检查
;
;  改硬件参数请编辑 src/Config.h，不要改本文件。
;  目录布局用 PlatformIO 默认约定（src / include / lib / test），
;  因此这里不覆写 [platformio] 的 *_dir —— 一旦写死，env 级 src_dir 会被
;  全局值盖掉，native 测试就会误编译需要 Arduino 的固件源码。
; ============================================================================
[platformio]
name         = Xagyl Filter Wheel ESP32
description  = Xagyl protocol filter wheel: TMC2209 + MT6701 absolute encoder
default_envs = esp32dev

; ---------------------------------------------------------------------------
; 目标硬件
; ---------------------------------------------------------------------------
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    teemuatlut/TMCStepper@^0.7.3

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; 想用构建系统切换硬件形态而不改源码，在 build_flags 里追加：
;   -D FW_ENCODER_BUS=2            改用 SSI/SPI 读 MT6701
;   -D FW_ENABLE_TMC_UART=0        纯 STEP/DIR，不接 TMC UART
;   -D FW_FILTER_SLOTS=7           7 位滤镜轮
;   -D FW_MOTOR_STEPS_PER_REV=400  0.9 度电机

; ---------------------------------------------------------------------------
; PC 上的纯逻辑测试（lib/xagyl_geom：角度展开、槽中心表、SSI 帧解析）
; 把被测库目录作为该环境的 src_dir 编译，因此不涉及 Arduino，也无需 LDF 探测。
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; PC 上的纯逻辑测试（lib/xagyl_geom：角度展开、槽中心表、SSI 帧解析）
;
; 实测结论：本机 PlatformIO 6.2.0 的 native 测试在 test_build_src=no 时
; 不会把 lib/ 下本地库的头路径与源码纳入 test 编译单元 —— 加 -I 会导致 LDF
; 认为「无依赖」而不编译库源码（链接期 undefined reference），不加 -I 则头文件
; 找不到。两种组合都试过，属于该版本 native 环境的已知行为，不是本工程代码问题。
;
; 因此本工程的单元测试以 test/test_xagyl_geom/run_tests.ps1 为准，
; 它用 PlatformIO 自带的 MinGW 工具链直接编译「测试 + 库 + Unity」并运行，
; 结果确定可复现。pio test -e native 保留为标准写法，便于后续 PlatformIO
; 版本修复该行为后直接可用。
; ---------------------------------------------------------------------------
[env:native]
platform        = native
test_build_src  = no
lib_ldf_mode    = chain+
build_flags     = -std=gnu++11 -Wall -Wextra
build_unflags   = -std=gnu++17
